# Gradle properties

# --- Existing content preserved above ---
# Proxy configuration for stable dependency resolution (added by assistant)
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=maven.neoforged.net|*.neoforged.net|maven.su5ed.dev

# Enforce TLS and prefer IPv4 to mitigate resets on neoforged maven
org.gradle.jvmargs=-Xmx4G -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3 -Djava.net.preferIPv4Stack=true -Djavax.net.ssl.trustStoreType=Windows-ROOT